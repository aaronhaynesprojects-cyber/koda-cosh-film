<!doctype html>
<meta charset="utf-8">
<title>Title layers</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="cv"></canvas>
<script>
// Transparent 1920x1080 title layers for the KODA x Cosh Living reel, one layer per render so each can fade on its own beat.
//   ?layer=koda   KODA logo (vector, ivory)          ?layer=hobl  "THE HOME OF BRANDED LIGHTING"
//   ?layer=cosh   "AT" + Cosh Living wordmark          ?layer=ltbl  "Let There Be Light"
//   ?y=           vertical centre of the lockup (default 470)
// Usage: PAGE=tools/title.html Q="layer=koda" node render.mjs png 0 out.png
const QS = new URLSearchParams(location.search);                 // ?w=&h= canvas (default 1920x1080), ?ls= lockup scale (render.mjs owns ?s=)
const W = +(QS.get("w") || 1920), H = +(QS.get("h") || 1080), SC = +(QS.get("ls") || 1), IVORY = "#f3eee4", STONE = "#cfc6b6";
const FONT = (w, px) => `${w} ${px}px "Helvetica Neue", "Avenir Next", Arial, sans-serif`;
const q = new URLSearchParams(location.search), LAYER = q.get("layer") || "koda", Y = +(q.get("y") || 470);
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"); cv.width = W; cv.height = H;
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function shadow(on) { ctx.shadowColor = on ? "rgba(0,0,0,0.55)" : "transparent"; ctx.shadowBlur = on ? 24 : 0; }
function tracked(text, y, px, weight, em, colour, alpha = 1) {
  ctx.font = FONT(weight, px); ctx.letterSpacing = px * em + "px"; ctx.textAlign = "center"; ctx.fillStyle = colour; ctx.globalAlpha = alpha;
  shadow(true); ctx.fillText(text, W / 2 + (px * em) / 2, y); ctx.letterSpacing = "0px"; ctx.globalAlpha = 1; shadow(false);
}
// tint an image to ivory; for a dark-on-white logo (no alpha) derive alpha from darkness
function tint(img, w, h, fromLuma) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const a = fromLuma ? 255 - (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) : p[i + 3];
    p[i] = 243; p[i + 1] = 238; p[i + 2] = 228; p[i + 3] = Math.max(0, Math.min(255, (a - 18) * 1.12));
  }
  x.putImageData(d, 0, 0); return c;
}
function trim(c) {
  const x = c.getContext("2d"), d = x.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y++) for (let i = 0; i < c.width; i++) if (d[(y * c.width + i) * 4 + 3] > 20) { x0 = Math.min(x0, i); x1 = Math.max(x1, i); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const t = document.createElement("canvas"); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1; t.getContext("2d").drawImage(c, -x0, -y0); return t;
}
let KODA, COSH;
async function draw() {
  ctx.clearRect(0, 0, W, H);
  if (LAYER === "koda") { const h = 118, w = h * KODA.width / KODA.height; shadow(true); ctx.drawImage(KODA, W / 2 - w / 2, Y - 150 - h / 2, w, h); shadow(false); }
  if (LAYER === "hobl") tracked("THE HOME OF BRANDED LIGHTING", Y - 20, 30, 400, 0.42, IVORY, 0.95);
  if (LAYER === "cosh") {
    tracked("AT", Y + 62, 17, 500, 0.5, STONE, 0.85);
    const h = 58, w = h * COSH.width / COSH.height; shadow(true); ctx.drawImage(COSH, W / 2 - w / 2, Y + 92, w, h); shadow(false);
  }
  if (LAYER === "ltbl") tracked("Let There Be Light", Y - 20, 84, 200, 0.04, IVORY, 1);
  // partnership lockup (client, 24 Nov): KODA | coshliving side by side, Cosh Living two-thirds larger than KODA
  if (LAYER === "pair" || LAYER === "pairhobl") {
    const hk = 92 * SC, wk = hk * KODA.width / KODA.height, wc = wk * 5 / 3, hc = wc * COSH.height / COSH.width, gap = 64 * SC, x0 = W / 2 - (wk + 2 * gap + 2 + wc) / 2, cy = Y - 60 * SC;
    if (LAYER === "pair") {
      shadow(true); ctx.drawImage(KODA, x0, cy - hk / 2, wk, hk);
      ctx.drawImage(COSH, x0 + wk + 2 * gap + 2, cy - hc / 2 + hc * 0.06, wc, hc); shadow(false);
      ctx.fillStyle = IVORY; ctx.globalAlpha = 0.55; ctx.fillRect(x0 + wk + gap, cy - 62 * SC, 2, 124 * SC); ctx.globalAlpha = 1;
    } else tracked("THE HOME OF BRANDED LIGHTING", cy + 128 * SC, 26 * SC, 400, 0.42, IVORY, 0.95);
  }
}
window.TOTAL = 1;
window.ready = (async () => {
  const k = await load("../src/logos/koda.svg");                    // KODA's own logo colour, #ED9A3D (from koda.svg); ?koda=ivory to tint
  if (q.get("koda") === "ivory") KODA = trim(tint(k, 2270, 600, false));
  else { const c = document.createElement("canvas"); c.width = 2270; c.height = 600; c.getContext("2d").drawImage(k, 0, 0, 2270, 600); KODA = trim(c); }
  const c = await load("../src/phil/logos-aaron/cosh-23.png"); COSH = trim(tint(c, c.naturalWidth * 3, c.naturalHeight * 3, true));
  return true;
})();
window.png = async () => { await draw(); return cv.toDataURL("image/png").slice(22); };
window.frame = async () => { await draw(); return cv.toDataURL("image/jpeg", 0.9).slice(23); };
</script>
